name: Install scripts

# The installers are verified against the published release rather than the
# working tree, so an unrelated code change cannot affect them. Running them on
# every push only burned CI minutes and inflated the release download counter,
# which is a headline number on the README. Run them when they change, on a
# weekly schedule that catches GitHub or release-hosting behaviour drifting
# underneath them, and on demand.
on:
  push:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-scripts.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-scripts.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint the POSIX installer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/install.sh scripts/render-homebrew-formula.sh scripts/extract-changelog.sh
      - name: Install with the POSIX script
        if: runner.os != 'Windows'
        run: |
          TAIGA_INSTALL_DIR="$RUNNER_TEMP/bin" sh scripts/install.sh
          "$RUNNER_TEMP/bin/taiga" version --json | grep '"version"'
      - name: Install with the PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -InstallDir "$env:RUNNER_TEMP\bin"
          & "$env:RUNNER_TEMP\bin\taiga.exe" version --json
